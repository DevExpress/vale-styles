name: Release

# Publishes @devexpress/vale-styles to GitHub Packages when a maintainer pushes a vX.Y.Z tag.
# A prerelease tag (vX.Y.Z-rc.N) on any commit, not only main, publishes under the `next`
# dist-tag and creates a GitHub prerelease. Use it to test a release before merging. A prerelease
# takes its notes from the CHANGELOG.md Unreleased section until the version has a section of its own.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com
          scope: '@devexpress'

      - name: Check the tag against package.json and CHANGELOG.md
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
          # A prerelease such as 1.1.0-rc.1 uses the notes of 1.1.0. If the changelog has no 1.1.0
          # section yet (a prerelease from a feature branch), it uses the Unreleased notes.
          base="${version%%-*}"
          notes() {
            awk -v heading="$1" '/^## / { printing = ($2 == heading); next } printing' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"
          }
          if ! notes "$base"; then
            if [ "$version" = "$base" ]; then
              echo "::error::CHANGELOG.md has no '## $base' section."
              exit 1
            fi
            if ! notes Unreleased; then
              echo "::error::CHANGELOG.md has no '## $base' section and no entries under '## Unreleased'."
              exit 1
            fi
          fi

      - run: npm ci
      - run: npm test

      # npm 11 refuses to publish a prerelease without an explicit dist-tag.
      - run: npm publish --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
