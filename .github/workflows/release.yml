name: Release

# Publishes @devexpress/vale-styles to GitHub Packages when a maintainer pushes a vX.Y.Z tag.
# A stable tag must point to a commit in the first-parent history of main (the merge commit of the
# release pull request), and its version must not be lower than the current `latest` version.
# A prerelease tag (vX.Y.Z-rc.N) on any commit, not only main, publishes under the `next`
# dist-tag and creates a GitHub prerelease. Use it to test a release before merging. A prerelease
# takes its notes from the CHANGELOG.md Unreleased section until the version has a section of its own.
#
# The test job runs third-party code (npm ci install scripts and the downloaded Vale binary), so it
# gets a read-only token. The publish job has write access and runs no third-party code: npm publish
# builds dist/ with the dependency-free scripts/build.mjs. Do not add install or test steps to it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com
          scope: '@devexpress'

      - name: Check the tag against package.json and CHANGELOG.md
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
          # A prerelease such as 1.1.0-rc.1 uses the notes of 1.1.0. If the changelog has no 1.1.0
          # section yet (a prerelease from a feature branch), it uses the Unreleased notes.
          base="${version%%-*}"
          notes() {
            awk -v heading="$1" '/^## / { printing = ($2 == heading); next } printing' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"
          }
          if ! notes "$base"; then
            if [ "$version" = "$base" ]; then
              echo "::error::CHANGELOG.md has no '## $base' section."
              exit 1
            fi
            if ! notes Unreleased; then
              echo "::error::CHANGELOG.md has no '## $base' section and no entries under '## Unreleased'."
              exit 1
            fi
          fi

      - name: Check that a stable tag is on main and not older than latest
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          if ! grep -qx "$(git rev-parse HEAD)" <(git rev-list --first-parent origin/main); then
            echo "::error::Tag $GITHUB_REF_NAME is not on the main branch. Tag the merge commit of the release pull request."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          # With no `latest` dist-tag yet, npm view prints nothing. A package that does not exist yet fails with E404.
          if ! latest="$(npm view @devexpress/vale-styles dist-tags.latest 2>"$RUNNER_TEMP/view.log")"; then
            grep -q E404 "$RUNNER_TEMP/view.log" || { cat "$RUNNER_TEMP/view.log" >&2; exit 1; }
          fi
          latest="${latest%%-*}"
          if [ -n "$latest" ] && [ "$version" != "$latest" ] &&
             [ "$(printf '%s\n' "$version" "$latest" | sort -V | head -n 1)" = "$version" ]; then
            echo "::error::$version is older than the latest version $latest. Publishing it would move the latest dist-tag back."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # npm 11 refuses to publish a prerelease without an explicit dist-tag.
      - run: npm publish --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
